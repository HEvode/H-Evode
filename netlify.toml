# ═══════════════════════════════════════════════════════════
# SDA LEARNING PLATFORM — Netlify configuration
# ═══════════════════════════════════════════════════════════

[build]
  publish = "."

# ─────────────────────────────────────────────────────────
# CACHE VERSION SUBSTITUTION
# Replaces CACHE_VERSION_PLACEHOLDER in service-worker.js
# with the commit SHA on every deploy.
# This is what triggers the SW update prompt in browsers.
# ─────────────────────────────────────────────────────────
[[plugins]]
  package = "@netlify/plugin-cache-headers"

# ─────────────────────────────────────────────────────────
# HEADERS — Cache control
# ─────────────────────────────────────────────────────────

# service-worker.js — must always revalidate
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# manifest.json — 1 day cache (rarely changes)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Icons — immutable (they have hashes in filename ideally)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — always revalidate (SPA entry point)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─────────────────────────────────────────────────────────
# SECURITY HEADERS
# ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ─────────────────────────────────────────────────────────
# SPA REDIRECTS — all paths serve index.html
# (Your app uses hash routes so most won't hit this,
#  but this future-proofs for any path-based routes.)
# ─────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200